name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minshuku
          POSTGRES_USER: minshuku
          POSTGRES_PASSWORD: minshuku
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U minshuku"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: mvn --batch-mode verify
      - name: PostgreSQL integration tests
        env:
          LOCAL_DB_TESTS: "true"
          DB_URL: jdbc:postgresql://localhost:55432/minshuku
          DB_USERNAME: minshuku
          DB_PASSWORD: minshuku
        run: mvn --batch-mode -Dtest='*LocalDbTest' test
