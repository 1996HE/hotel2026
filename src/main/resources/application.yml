server:
  port: 8000
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: ${APP_CONTEXT_PATH:/jukai-internal}
  server-header:
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:100}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: minshuku-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/minshuku}
    username: ${DB_USERNAME:minshuku}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD_MS:20000}
  sql:
    init:
      mode: never
      data-locations: classpath:db/data.sql
      continue-on-error: ${SQL_INIT_CONTINUE_ON_ERROR:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.minshuku.mapper: ${MYBATIS_LOG_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  checkout-sync-cron: ${APP_CHECKOUT_SYNC_CRON:0 * * * * *}
  time-zone: ${APP_TIME_ZONE:Asia/Tokyo}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    cron: ${BACKUP_CRON:0 0 2 * * *}
    directory: ${BACKUP_DIRECTORY:./backups}
    pg-dump-command: ${PG_DUMP_COMMAND:pg_dump}
  public-booking:
    hold-hours: ${PUBLIC_BOOKING_HOLD_HOURS:24}
    cancellation-cutoff-hours: ${PUBLIC_BOOKING_CANCEL_CUTOFF_HOURS:72}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8000/jukai-internal}
    mail-enabled: ${BOOKING_MAIL_ENABLED:false}
    mail-from: ${BOOKING_MAIL_FROM:}
    admin-mail: ${BOOKING_ADMIN_MAIL:}
    turnstile-required: ${TURNSTILE_REQUIRED:false}
    turnstile-site-key: ${TURNSTILE_SITE_KEY:}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
