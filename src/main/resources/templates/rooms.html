<!doctype html> <!-- HTML5ドキュメントタイプを宣言。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"> <!-- ページ言語を日本語にし、Thymeleaf名前空間を有効化。 -->
<head> <!-- head設定を開始。 -->
  <meta charset="UTF-8"> <!-- 設定ページ文字コードに UTF-8。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 設定モバイルレスポンシブ視口。 -->
  <title>部屋管理</title> <!-- 設定ブラウザ標題。 -->
  <link rel="stylesheet" th:href="@{/styles/app.css}"> <!-- 読み込みシステム様式ファイル。 -->
</head> <!-- head設定を終了。 -->
<body> <!-- ページ本文を開始。 -->
<header class="topbar"> <!-- トップナビゲーションを定義。 -->
  <a class="brand" href="https://www.booking.com/hotel/jp/bai-ma-shu-hai.zh-cn.html?aid=356980&amp;label=gog235jc-10CAsodUIOYmFpLW1hLXNodS1oYWlIFVgDaHWIAQGYATO4AQfIAQ3YAQPoAQH4AQGIAgGoAgG4AsznytEGwAIB0gIkYjBjNDlkMDgtZDMxZC00NTFkLTkwYWMtMWViOGJhYmY3OTg22AIB4AIB&amp;sid=207e58d33fdee9668a455c0642fd9feb&amp;dist=0&amp;keep_landing=1&amp;sb_price_type=total&amp;type=total&amp;chal_t=1781707724773&amp;force_referer=https%3A%2F%2Fwww.google.com%2F" target="_blank" rel="noopener noreferrer">白馬樹海</a> <!-- 民宿名を表示し、外部予約ページへリンク。 -->
  <nav class="nav"> <!-- メインナビゲーション領域を定義。 -->
    <a th:href="@{/dashboard}">予約一覧</a> <!-- 予約一覧への導線を提供。 -->
    <a th:href="@{/rooms}" class="active">部屋</a> <!-- 部屋管理への導線を提供。 -->
    <a th:href="@{/reservations}">予約</a> <!-- 予約管理への導線を提供。 -->
    <a th:href="@{/prices}">料金</a> <!-- 料金管理への導線を提供。 -->
  </nav> <!-- メインナビゲーション領域を終了。 -->
</header> <!-- トップナビゲーションを終了。 -->
<main class="page grid-page"> <!-- 定義带左右レイアウトのページメインコンテンツコンテナ。 -->
  <section class="panel"> <!-- 部屋登録フォームのパネルを定義。 -->
    <h1>部屋登録</h1> <!-- 表示新規登録部屋標題。 -->
    <p class="notice success" th:if="${message}" th:text="${message}">message</p> <!-- 成功メッセージを表示。 -->
    <p class="notice error" th:if="${error}" th:text="${error}">error</p> <!-- エラーメッセージを表示。 -->
    <form class="form" th:action="@{/rooms}" th:object="${room}" method="post"> <!-- 定義新規登録部屋フォーム。 -->
      <label>部屋番号<input th:field="*{roomNumber}" placeholder="101"></label> <!-- 入力部屋番号。 -->
      <label>部屋名<input th:field="*{roomName}" placeholder="桜の間"></label> <!-- 入力部屋名称。 -->
      <label>部屋タイプ<select th:field="*{roomType}"><option value="washitsu">大号床间</option><option value="yoshitsu">双人间</option><option value="suite">三人间</option><option value="family">家庭间</option></select></label> <!-- 選択部屋タイプ。 -->
      <label>定員<input type="number" min="1" th:field="*{capacity}" placeholder="2"></label> <!-- 入力宿泊人数上限。 -->
      <label>基本料金<input type="number" min="0" step="100" th:field="*{basePricePerPerson}" placeholder="8800"></label> <!-- 入力每人基本単価。 -->
      <label class="check"><input type="checkbox" th:field="*{privateBath}"> 専用バス付き</label> <!-- 設定是否有独立浴室。 -->
      <input type="hidden" name="occupancyStatus" value="vacant"> <!-- 設定新規登録部屋初期値宿泊状態に空室。 -->
      <input type="hidden" name="cleaningStatus" value="cleaned"> <!-- 設定新規登録部屋初期値清掃状態に清掃済。 -->
      <input type="hidden" name="active" value="true"> <!-- 設定新規登録部屋初期値有効。 -->
      <label>メモ<textarea th:field="*{note}" rows="3"></textarea></label> <!-- 入力部屋メモ。 -->
      <button type="submit">登録</button> <!-- 送信新規登録部屋フォーム。 -->
    </form> <!-- 終了新規登録部屋フォーム。 -->
  </section> <!-- 部屋登録フォームのパネルを終了。 -->
  <section class="panel wide"> <!-- 部屋一覧パネルを定義。 -->
    <h1>部屋一覧</h1> <!-- 表示部屋一覧標題。 -->
    <div class="table-scroll"> <!-- 部屋一覧の横スクロール領域を定義。 -->
    <table class="table room-table"> <!-- 定義部屋一覧テーブル。 -->
      <colgroup> <!-- 定義部屋一覧列幅。 -->
        <col class="room-col-no"> <!-- 番号列。 -->
        <col class="room-col-name"> <!-- 名前列。 -->
        <col class="room-col-type"> <!-- タイプ列。 -->
        <col class="room-col-capacity"> <!-- 定員列。 -->
        <col class="room-col-price"> <!-- 料金列。 -->
        <col class="room-col-status"> <!-- 状態列。 -->
        <col class="room-col-cleaning"> <!-- 清掃列。 -->
        <col class="room-col-update"> <!-- 状態更新列。 -->
        <col class="room-col-delete"> <!-- 削除列。 -->
      </colgroup> <!-- 終了部屋一覧列幅。 -->
      <thead><tr><th>番号</th><th>名前</th><th>タイプ</th><th>定員</th><th>料金</th><th>状態</th><th>清掃</th><th>状態更新</th><th>削除</th></tr></thead> <!-- 定義部屋ヘッダー。 -->
      <tbody> <!-- 定義部屋テーブルコンテンツ。 -->
      <tr th:each="roomItem : ${rooms}"> <!-- 反復部屋一覧。 -->
        <td th:text="${roomItem.roomNumber}">101</td> <!-- 部屋番号を表示。 -->
        <td th:text="${roomItem.roomName}">桜の間</td> <!-- 部屋名を表示。 -->
        <td th:text="${roomItem.roomType == 'washitsu' ? '大号床间' : (roomItem.roomType == 'yoshitsu' ? '双人间' : (roomItem.roomType == 'suite' ? '三人间' : (roomItem.roomType == 'family' ? '家庭间' : '其他')))}">大号床间</td> <!-- 部屋タイプを表示。 -->
        <td th:text="${roomItem.capacity}">2</td> <!-- 定員を表示。 -->
        <td th:text="${'¥' + roomItem.basePricePerPerson}">¥8800</td> <!-- 基本単価を表示。 -->
        <td><span class="tag" th:text="${roomItem.occupancyStatus == 'occupied' ? '滞で中' : (roomItem.occupancyStatus == 'reserved' ? '予約済' : '空室')}">空室</span></td> <!-- 宿泊状態を表示。 -->
        <td><span class="tag" th:text="${roomItem.cleaningStatus == 'needs_cleaning' ? '清掃待ち' : '清掃済'}">清掃済</span></td> <!-- 清掃状態を表示。 -->
        <td> <!-- 状態更新セルを定義。 -->
          <form class="inline-form room-status-form" th:action="@{/rooms/{id}/statuses(id=${roomItem.id})}" method="post"> <!-- 部屋状態更新フォームを定義。 -->
            <div class="room-status-fields"> <!-- 定義状態ドロップダウン框分组コンテナ。 -->
              <select name="occupancyStatus"><option value="vacant">空室</option><option value="reserved">予約済</option><option value="occupied">滞で中</option></select> <!-- 選択宿泊状態。 -->
              <select name="cleaningStatus"><option value="cleaned">清掃済</option><option value="needs_cleaning">清掃待ち</option></select> <!-- 選択清掃状態。 -->
            </div> <!-- 終了状態ドロップダウン框分组コンテナ。 -->
            <button type="submit">更新</button> <!-- 送信状態更新フォーム。 -->
          </form> <!-- 部屋状態更新フォームを終了。 -->
        </td> <!-- 終了状態更新单元格。 -->
        <td> <!-- 部屋削除セルを定義。 -->
          <form class="inline-form" th:action="@{/rooms/{id}/delete(id=${roomItem.id})}" method="post"> <!-- 部屋削除フォームを定義。 -->
            <button type="submit" class="danger">削除</button> <!-- 送信部屋削除操作。 -->
          </form> <!-- 部屋削除フォームを終了。 -->
        </td> <!-- 終了部屋削除单元格。 -->
      </tr> <!-- 終了部屋记录行。 -->
      </tbody> <!-- 終了部屋テーブルコンテンツ。 -->
    </table> <!-- 終了部屋一覧テーブル。 -->
    </div> <!-- 終了部屋一覧横スクロールコンテナ。 -->
    <h1 class="subsection-title">削除済み部屋一覧</h1> <!-- 表示削除済み部屋一覧標題。 -->
    <div class="table-scroll"> <!-- 削除済み部屋一覧の横スクロール領域を定義。 -->
    <table class="table deleted-room-table"> <!-- 削除済み部屋一覧テーブルを定義。 -->
      <colgroup> <!-- 削除済み部屋一覧の列幅を定義。 -->
        <col class="room-col-no"> <!-- 番号列。 -->
        <col class="room-col-name"> <!-- 名前列。 -->
        <col class="room-col-type"> <!-- タイプ列。 -->
        <col class="room-col-capacity"> <!-- 定員列。 -->
        <col class="room-col-price"> <!-- 料金列。 -->
        <col class="room-col-updated"> <!-- 最終更新列。 -->
      </colgroup> <!-- 終了削除済み部屋一覧列幅。 -->
      <thead><tr><th>番号</th><th>名前</th><th>タイプ</th><th>定員</th><th>料金</th><th>最終更新</th></tr></thead> <!-- 定義削除済み部屋ヘッダー。 -->
      <tbody> <!-- 定義削除済み部屋テーブルコンテンツ。 -->
      <tr th:each="roomItem : ${deletedRooms}"> <!-- 反復削除済み部屋一覧。 -->
        <td th:text="${roomItem.roomNumber}">101</td> <!-- 部屋番号を表示。 -->
        <td th:text="${roomItem.roomName}">桜の間</td> <!-- 部屋名を表示。 -->
        <td th:text="${roomItem.roomType == 'washitsu' ? '大号床间' : (roomItem.roomType == 'yoshitsu' ? '双人间' : (roomItem.roomType == 'suite' ? '三人间' : (roomItem.roomType == 'family' ? '家庭间' : '其他')))}">大号床间</td> <!-- 部屋タイプを表示。 -->
        <td th:text="${roomItem.capacity}">2</td> <!-- 定員を表示。 -->
        <td th:text="${'¥' + roomItem.basePricePerPerson}">¥8800</td> <!-- 基本単価を表示。 -->
        <td th:text="${roomItem.updatedAt}">更新日時</td> <!-- 削除日時を表示。 -->
      </tr> <!-- 終了削除済み部屋记录行。 -->
      <tr th:if="${#lists.isEmpty(deletedRooms)}"><td colspan="6" class="empty">削除済み部屋はありません。</td></tr> <!-- 削除済み部屋がない旨を表示。 -->
      </tbody> <!-- 終了削除済み部屋テーブルコンテンツ。 -->
    </table> <!-- 終了削除済み部屋一覧テーブル。 -->
    </div> <!-- 終了削除済み部屋一覧横スクロールコンテナ。 -->
  </section> <!-- 部屋一覧パネルを終了。 -->
</main> <!-- 終了ページメインコンテンツコンテナ。 -->
</body> <!-- ページ本文を終了。 -->
</html> <!-- 終了 HTML 文档。 -->
