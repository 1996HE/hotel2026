<!doctype html> <!-- HTML5ドキュメントタイプを宣言。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"> <!-- ページ言語を日本語にし、Thymeleaf名前空間を有効化。 -->
<head> <!-- head設定を開始。 -->
  <meta charset="UTF-8"> <!-- 設定ページ文字コードに UTF-8。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 設定モバイルレスポンシブ視口。 -->
  <title>料金管理</title> <!-- 設定ブラウザ標題。 -->
  <link rel="stylesheet" th:href="@{/styles/app.css}"> <!-- 読み込みシステム様式ファイル。 -->
</head> <!-- head設定を終了。 -->
<body> <!-- ページ本文を開始。 -->
<header class="topbar"> <!-- トップナビゲーションを定義。 -->
  <a class="brand" href="https://www.booking.com/hotel/jp/bai-ma-shu-hai.zh-cn.html?aid=356980&amp;label=gog235jc-10CAsodUIOYmFpLW1hLXNodS1oYWlIFVgDaHWIAQGYATO4AQfIAQ3YAQPoAQH4AQGIAgGoAgG4AsznytEGwAIB0gIkYjBjNDlkMDgtZDMxZC00NTFkLTkwYWMtMWViYmY3OTg22AIB4AIB&amp;sid=207e58d33fdee9668a455c0642fd9feb&amp;dist=0&amp;keep_landing=1&amp;sb_price_type=total&amp;type=total&amp;chal_t=1781707724773&amp;force_referer=https%3A%2F%2Fwww.google.com%2F" target="_blank" rel="noopener noreferrer">白馬樹海</a> <!-- 民宿名を表示し、外部予約ページへリンク。 -->
  <nav class="nav"> <!-- メインナビゲーション領域を定義。 -->
    <a th:href="@{/dashboard}">予約一覧</a> <!-- 予約一覧への導線を提供。 -->
    <a th:href="@{/rooms}">部屋</a> <!-- 部屋管理への導線を提供。 -->
    <a th:href="@{/reservations}">予約</a> <!-- 予約管理への導線を提供。 -->
    <a th:href="@{/prices}" class="active">料金</a> <!-- 料金管理への導線を提供。 -->
  </nav> <!-- メインナビゲーション領域を終了。 -->
</header> <!-- トップナビゲーションを終了。 -->
<main class="page grid-page"> <!-- 定義带左右レイアウトのページメインコンテンツコンテナ。 -->
  <section class="panel"> <!-- 料金ルール登録フォームのパネルを定義。 -->
    <h1>料金ルール登録</h1> <!-- 表示新規登録料金ルール標題。 -->
    <p class="notice success" th:if="${message}" th:text="${message}">message</p> <!-- 成功メッセージを表示。 -->
    <p class="notice error" th:if="${error}" th:text="${error}">error</p> <!-- エラーメッセージを表示。 -->
    <form class="form" th:action="@{/prices}" th:object="${rule}" method="post"> <!-- 料金ルール登録フォームを定義。 -->
      <label>部屋<select th:field="*{roomId}"><option value="">選択してください</option><option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber + ' ' + room.roomName}">101 桜の間</option></select></label> <!-- 選択料金ルール适用部屋。 -->
      <label>ルール名<input th:field="*{ruleName}" placeholder="紅葉シーズン"></label> <!-- 入力料金ルール名称。 -->
      <label>開始日<input type="date" th:field="*{startDate}"></label> <!-- 入力料金ルール開始日付。 -->
      <label>終了日<input type="date" th:field="*{endDate}"></label> <!-- 入力料金ルール終了日付。 -->
      <label>一人料金<input type="number" min="0" step="100" th:field="*{pricePerPerson}" placeholder="12800"></label> <!-- 入力每人单价。 -->
      <label>優先度<input type="number" min="1" th:field="*{priority}" placeholder="10"></label> <!-- 入力料金ルール优先级。 -->
      <input type="hidden" th:field="*{active}" value="true"> <!-- 設定新規登録料金ルール初期値有効。 -->
      <label>メモ<textarea th:field="*{note}" rows="3"></textarea></label> <!-- 入力料金ルールメモ。 -->
      <button type="submit">登録</button> <!-- 送信新規登録料金ルールフォーム。 -->
    </form> <!-- 料金ルール登録フォームを終了。 -->
  </section> <!-- 料金ルール登録フォームを終了面板。 -->
  <section class="panel wide"> <!-- 料金ルール一覧パネルを定義。 -->
    <h1>料金ルール一覧</h1> <!-- 表示料金ルール一覧標題。 -->
    <form class="price-bulk-form" th:action="@{/prices/delete-selected}" method="post"> <!-- 料金ルール一括削除フォームを定義。 -->
      <div class="price-bulk-actions"> <!-- 定義一括操作領域。 -->
        <button type="submit" class="danger">選択削除</button> <!-- 送信一括削除操作。 -->
      </div> <!-- 終了一括操作領域。 -->
      <div class="table-scroll"> <!-- 料金一覧の横スクロール領域を定義。 -->
      <table class="table price-table"> <!-- 定義料金ルール一覧テーブル。 -->
      <colgroup> <!-- 定義料金ルールテーブル列幅。 -->
        <col class="price-col-select"> <!-- 選択列。 -->
        <col class="price-col-room"> <!-- 部屋列。 -->
        <col class="price-col-rule"> <!-- ルール名列。 -->
        <col class="price-col-date"> <!-- 開始日付列。 -->
        <col class="price-col-date"> <!-- 終了日付列。 -->
        <col class="price-col-price"> <!-- 料金列。 -->
        <col class="price-col-priority"> <!-- 优先度列。 -->
        <col class="price-col-status"> <!-- 状態列。 -->
        <col class="price-col-note"> <!-- メモ列。 -->
        <col class="price-col-actions"> <!-- 操作列。 -->
      </colgroup> <!-- 終了料金ルールテーブル列幅。 -->
      <thead><tr><th class="price-col-check">選択</th><th>部屋</th><th>ルール</th><th>開始日</th><th>終了日</th><th>料金</th><th>優先度</th><th>状態</th><th>メモ</th><th>操作</th></tr></thead> <!-- 定義料金ルールヘッダー。 -->
      <tbody> <!-- 定義料金ルールテーブルコンテンツ。 -->
      <tr th:each="item : ${rules}"> <!-- 反復料金ルール一覧。 -->
        <td class="price-col-check"><input type="checkbox" name="ids" th:value="${item.id}"></td> <!-- 選択必要要一括削除のルール。 -->
        <td th:text="${item.roomNumber + ' ' + item.roomName}">101 桜の間</td> <!-- 表示部屋信息。 -->
        <td th:text="${item.ruleName}">夏休み料金</td> <!-- 表示ルール名称。 -->
        <td th:text="${item.startDate}">2026-07-01</td> <!-- 表示開始日付。 -->
        <td th:text="${item.endDate}">2026-08-31</td> <!-- 表示終了日付。 -->
        <td th:text="${item.pricePerPerson}">12800</td> <!-- 表示料金。 -->
        <td th:text="${item.priority}">10</td> <!-- 表示优先度。 -->
        <td th:text="${item.active ? '有効' : '無効'}">有効</td> <!-- 表示状態。 -->
        <td th:text="${item.note}">メモ</td> <!-- 表示メモ。 -->
        <td class="actions price-actions"> <!-- 定義料金ルール操作单元格。 -->
          <button type="submit" class="danger" th:formaction="@{/prices/{id}/delete(id=${item.id})}" formmethod="post">削除</button> <!-- 送信单条削除。 -->
        </td> <!-- 終了操作单元格。 -->
      </tr> <!-- 終了料金ルール记录行。 -->
      <tr th:if="${#lists.isEmpty(rules)}"><td colspan="10" class="empty">料金ルールがありません。</td></tr> <!-- 表示没有料金ルールのメッセージ。 -->
      </tbody> <!-- 終了料金ルールテーブルコンテンツ。 -->
      </table> <!-- 終了料金ルール一覧テーブル。 -->
      </div> <!-- 終了料金テーブル横スクロールコンテナ。 -->
    </form> <!-- 終了料金ルール一括削除フォーム。 -->
  </section> <!-- 料金ルール一覧パネルを終了。 -->
</main> <!-- 終了ページメインコンテンツコンテナ。 -->
</body> <!-- ページ本文を終了。 -->
</html> <!-- 終了 HTML 文档。 -->
