<!doctype html> <!-- HTML5ドキュメントタイプを宣言。 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"> <!-- ページ言語を日本語にし、Thymeleaf名前空間を有効化。 -->
<head> <!-- head設定を開始。 -->
  <meta charset="UTF-8"> <!-- 設定ページ文字コードに UTF-8。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 設定モバイルレスポンシブ視口。 -->
  <title>白馬樹海 予約一覧</title> <!-- 設定ブラウザ標題に民宿予約一覧。 -->
  <link rel="stylesheet" th:href="@{/styles/app.css}"> <!-- 読み込みシステム様式ファイル。 -->
</head> <!-- head設定を終了。 -->
<body> <!-- ページ本文を開始。 -->
<header class="topbar"> <!-- トップナビゲーションを定義。 -->
  <a class="brand" href="https://www.booking.com/hotel/jp/bai-ma-shu-hai.zh-cn.html?aid=356980&amp;label=gog235jc-10CAsodUIOYmFpLW1hLXNodS1oYWlIFVgDaHWIAQGYATO4AQfIAQ3YAQPoAQH4AQGIAgGoAgG4AsznytEGwAIB0gIkYjBjNDlkMDgtZDMxZC00NTFkLTkwYWMtMWViOGJhYmY3OTg22AIB4AIB&amp;sid=207e58d33fdee9668a455c0642fd9feb&amp;dist=0&amp;keep_landing=1&amp;sb_price_type=total&amp;type=total&amp;chal_t=1781707724773&amp;force_referer=https%3A%2F%2Fwww.google.com%2F" target="_blank" rel="noopener noreferrer">白馬樹海</a> <!-- 民宿名を表示し、外部予約ページへリンク。 -->
  <nav class="nav"> <!-- メインナビゲーション領域を定義。 -->
    <a th:href="@{/dashboard}" class="active">予約一覧</a> <!-- 予約一覧への導線を提供。 -->
    <a th:href="@{/rooms}">部屋</a> <!-- 部屋管理への導線を提供。 -->
    <a th:href="@{/reservations}">予約</a> <!-- 予約管理への導線を提供。 -->
    <a th:href="@{/prices}">料金</a> <!-- 料金管理への導線を提供。 -->
  </nav> <!-- メインナビゲーション領域を終了。 -->
</header> <!-- トップナビゲーションを終了。 -->
<main class="page"> <!-- 定義ページメインコンテンツコンテナ。 -->
  <section class="hero"> <!-- 定義ホーム概览領域。 -->
    <p class="eyebrow">白馬樹海 宿泊予約管理</p> <!-- 表示白馬樹海予約ワークベンチ副標題。 -->
    <h1>白馬樹海 予約一覧</h1> <!-- 表示予約一覧主標題。 -->
    <p>宿泊予約、支払い状況、部屋割りを確認します。</p> <!-- 表示予約一覧機能要約。 -->
  </section> <!-- 終了ホーム概览領域。 -->
  <section class="metrics"> <!-- 定義指標卡片領域。 -->
    <article class="metric"> <!-- 定義部屋総数指標卡片。 -->
      <span>部屋数</span> <!-- 表示指標名称。 -->
      <strong th:text="${roomCount}">0</strong> <!-- 表示部屋総数。 -->
    </article> <!-- 終了部屋総数指標卡片。 -->
    <article class="metric"> <!-- 定義空室件数指標卡片。 -->
      <span>空室</span> <!-- 表示指標名称。 -->
      <strong th:text="${vacantCount}">0</strong> <!-- 表示空室件数。 -->
    </article> <!-- 終了空室件数指標卡片。 -->
    <article class="metric"> <!-- 定義有効予約指標卡片。 -->
      <span>有効予約</span> <!-- 表示指標名称。 -->
      <strong th:text="${bookedCount}">0</strong> <!-- 表示有効予約件数。 -->
    </article> <!-- 終了有効予約指標卡片。 -->
  </section> <!-- 終了指標卡片領域。 -->
  <section class="panel"> <!-- 定義近期予約面板。 -->
    <div class="section-title pager-title"> <!-- 定義面板標題行とページング領域。 -->
      <h2>予約一覧</h2> <!-- 表示予約一覧標題。 -->
      <div class="pager"> <!-- 定義ホーム予約ページングナビゲーション。 -->
        <a class="pager-link" th:if="${reservationPage > 1}" th:href="@{/dashboard(page=${reservationPage - 1})}">前へ</a> <!-- 遷移へ上一页。 -->
        <span class="pager-state" th:text="${reservationPage + ' / ' + reservationTotalPages}">1 / 1</span> <!-- 表示現在ページ番号と总页数。 -->
        <a class="pager-link" th:if="${reservationPage < reservationTotalPages}" th:href="@{/dashboard(page=${reservationPage + 1})}">次へ</a> <!-- 遷移へ下一页。 -->
        <a class="button" th:href="@{/reservations}">予約登録</a> <!-- 提供遷移予約登记のボタン。 -->
      </div> <!-- 終了ホーム予約ページングナビゲーション。 -->
    </div> <!-- 終了面板標題行。 -->
    <table class="table reservation-table"> <!-- 定義近期予約テーブルと使用与予約页一致の紧凑様式。 -->
      <colgroup> <!-- 定義近期予約列幅。 -->
        <col class="col-no"> <!-- 予約番号列。 -->
        <col class="col-room"> <!-- 部屋列。 -->
        <col class="col-guest"> <!-- 予約宿泊者列。 -->
        <col class="col-count"> <!-- 人数列。 -->
        <col class="col-contact"> <!-- 連絡先列。 -->
        <col class="col-form"> <!-- 予約形式列。 -->
        <col class="col-companion"> <!-- 同行者列。 -->
        <col class="col-date"> <!-- 日程列。 -->
        <col class="col-payment-status"> <!-- 支払い状態列。 -->
        <col class="col-reservation-status"> <!-- 予約状態列。 -->
      </colgroup> <!-- 終了近期予約列幅。 -->
      <thead> <!-- 定義ヘッダー。 -->
      <tr> <!-- 定義ヘッダー行。 -->
        <th>予約番号</th> <!-- 表示予約番号列名。 -->
        <th>部屋</th> <!-- 表示部屋列名。 -->
        <th>予約客様</th> <!-- 表示予約宿泊者列名。 -->
        <th>人数</th> <!-- 表示予約宿泊者人数列名。 -->
        <th>連絡先</th> <!-- 表示連絡方式列名。 -->
        <th>予約形式</th> <!-- 表示予約形式列名。 -->
        <th>同行者</th> <!-- 表示同行者列名。 -->
        <th>日程</th> <!-- 表示日程列名。 -->
        <th>支払い</th> <!-- 表示支払い状態列名。 -->
        <th>予約状態</th> <!-- 表示予約状態列名。 -->
      </tr> <!-- 終了ヘッダー行。 -->
      </thead> <!-- 終了ヘッダー。 -->
      <tbody> <!-- 定義テーブルコンテンツ。 -->
      <tr th:each="reservation : ${recentReservations}"> <!-- 反復近期予約レコード。 -->
        <td th:text="${reservation.reservationNo}">RSV</td> <!-- 表示予約番号。 -->
        <td th:text="${reservation.roomNumber + ' ' + reservation.roomName}">101 桜の間</td> <!-- 部屋番号を表示と名称。 -->
        <td th:text="${reservation.guestName + ' / ' + (reservation.guestGender == null || reservation.guestGender == '' ? '性別未入力' : reservation.guestGender) + ' / ' + (reservation.guestAge == null ? '年齢未入力' : reservation.guestAge + '歳')}">山田太郎 / 男性 / 30歳</td> <!-- 表示予約宿泊者氏名、性別と年齢。 -->
        <td th:text="${reservation.guestCount + '名'}">2名</td> <!-- 表示予約宿泊者人数。 -->
        <td th:text="${(reservation.guestPhone == null || reservation.guestPhone == '' ? '電話未入力' : reservation.guestPhone) + ' / ' + (reservation.guestEmail == null || reservation.guestEmail == '' ? 'メール未入力' : reservation.guestEmail)}">電話 / メール</td> <!-- 表示予約宿泊者連絡方式。 -->
        <td th:text="${reservation.reservationForm == null || reservation.reservationForm == '' ? '公式' : reservation.reservationForm}">公式</td> <!-- 表示予約形式。 -->
        <td th:text="${reservation.companionSummary == null || reservation.companionSummary == '' ? '同行者なし' : reservation.companionSummary}">同行者なし</td> <!-- 表示同行者情報。 -->
        <td th:text="${reservation.checkInDate + ' - ' + reservation.checkOutDate}">2026-07-01 - 2026-07-02</td> <!-- 表示宿泊へチェックアウト日付。 -->
        <td><span class="tag" th:text="${reservation.paymentStatusLabel}">未払い</span></td> <!-- 表示日文支払い状態ラベル。 -->
        <td><span class="tag" th:text="${reservation.reservationStatusLabel}">予約済</span></td> <!-- 表示日文予約状態ラベル。 -->
      </tr> <!-- 終了予約レコード行。 -->
      <tr th:if="${#lists.isEmpty(recentReservations)}"> <!-- でなし予約时表示空状態行。 -->
        <td colspan="10" class="empty">予約データがありません。</td> <!-- 表示なし予約データのメッセージ。 -->
      </tr> <!-- 終了空状態行。 -->
      </tbody> <!-- 終了テーブルコンテンツ。 -->
    </table> <!-- 終了近期予約テーブル。 -->
  </section> <!-- 終了近期予約面板。 -->
</main> <!-- 終了ページメインコンテンツコンテナ。 -->
</body> <!-- ページ本文を終了。 -->
</html> <!-- 終了 HTML 文档。 -->
